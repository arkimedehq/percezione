# Percezione's broker: inside the compose network only, with the logins created by the setup service.
listener 1883
allow_anonymous false
password_file /mosquitto/secrets/passwd
# Frigate writes only frigate/#, Percezione perception/# and homeassistant/# (written by setup)
acl_file /mosquitto/secrets/acl
persistence false
log_dest stdout
log_type error
log_type warning
