<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Percezione: cameras in, events about people out</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <g id="cam">
      <rect x="-22" y="-14" width="34" height="28" rx="6" fill="#e2e8f0"/>
      <path d="M12,-7 L26,-14 L26,14 L12,7 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="7" fill="#0f172a"/>
      <circle cx="-5" cy="0" r="3" fill="#38bdf8"/>
    </g>
  </defs>

  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>

  <!-- title -->
  <text x="60" y="70" fill="#f8fafc" font-size="34" font-weight="700">Percezione</text>
  <text x="60" y="102" fill="#94a3b8" font-size="18">Who is home, where, and what they are doing — from your own cameras, on your own machine.</text>

  <!-- cameras -->
  <g font-size="15" fill="#cbd5e1">
    <g transform="translate(110,190)"><use href="#cam"/><text x="46" y="5">front door</text></g>
    <g transform="translate(110,270)"><use href="#cam"/><text x="46" y="5">living room</text></g>
    <g transform="translate(110,350)"><use href="#cam"/><text x="46" y="5">garden</text></g>
    <g transform="translate(110,430)"><use href="#cam"/><text x="46" y="5">kitchen</text></g>
  </g>
  <text x="88" y="490" fill="#64748b" font-size="13">RTSP · go2rtc · Frigate</text>

  <!-- arrows in -->
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M250,190 C300,190 300,300 352,300"/>
    <path d="M250,270 C300,270 300,305 352,305"/>
    <path d="M250,350 C300,350 300,315 352,315"/>
    <path d="M250,430 C300,430 300,320 352,320"/>
  </g>

  <!-- core -->
  <rect x="360" y="200" width="250" height="220" rx="20" fill="url(#core)"/>
  <circle cx="485" cy="262" r="30" fill="none" stroke="#e0e7ff" stroke-width="4"/>
  <circle cx="485" cy="262" r="12" fill="#e0e7ff"/>
  <text x="485" y="325" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">Percezione</text>
  <text x="485" y="352" text-anchor="middle" fill="#c7d2fe" font-size="14">faces · activities · posture</text>
  <text x="485" y="374" text-anchor="middle" fill="#c7d2fe" font-size="14">groups · zones · rules</text>
  <text x="485" y="396" text-anchor="middle" fill="#c7d2fe" font-size="14">runs locally, private</text>

  <!-- arrow out -->
  <path d="M618,310 L668,310" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- events -->
  <g font-size="15">
    <rect x="680" y="150" width="460" height="54" rx="12" fill="#1e293b" stroke="#334155"/>
    <circle cx="706" cy="177" r="7" fill="#22c55e"/>
    <text x="724" y="173" fill="#f1f5f9" font-weight="600">arrived</text>
    <text x="724" y="193" fill="#94a3b8" font-size="13">Laura came home · living room</text>

    <rect x="680" y="214" width="460" height="54" rx="12" fill="#1e293b" stroke="#334155"/>
    <circle cx="706" cy="241" r="7" fill="#38bdf8"/>
    <text x="724" y="237" fill="#f1f5f9" font-weight="600">external · doorbell</text>
    <text x="724" y="257" fill="#94a3b8" font-size="13">at the door: Tom and someone unknown · best face of each</text>

    <rect x="680" y="278" width="460" height="54" rx="12" fill="#1e293b" stroke="#334155"/>
    <circle cx="706" cy="305" r="7" fill="#a78bfa"/>
    <text x="724" y="301" fill="#f1f5f9" font-weight="600">activity_changed</text>
    <text x="724" y="321" fill="#94a3b8" font-size="13">Laura: cooking → eating · kitchen</text>

    <rect x="680" y="342" width="460" height="54" rx="12" fill="#1e293b" stroke="#334155"/>
    <circle cx="706" cy="369" r="7" fill="#f97316"/>
    <text x="724" y="365" fill="#f1f5f9" font-weight="600">posture_changed</text>
    <text x="724" y="385" fill="#94a3b8" font-size="13">someone on the floor · garden</text>

    <rect x="680" y="406" width="460" height="54" rx="12" fill="#1e293b" stroke="#334155"/>
    <circle cx="706" cy="433" r="7" fill="#eab308"/>
    <text x="724" y="429" fill="#f1f5f9" font-weight="600">object_left</text>
    <text x="724" y="449" fill="#94a3b8" font-size="13">a parcel at the gate · front door</text>
  </g>

  <!-- outputs -->
  <g font-size="13" font-weight="600" text-anchor="middle">
    <rect x="680" y="488" width="112" height="34" rx="17" fill="#0f172a" stroke="#475569"/>
    <text x="736" y="510" fill="#e2e8f0">Home Assistant</text>
    <rect x="800" y="488" width="66" height="34" rx="17" fill="#0f172a" stroke="#475569"/>
    <text x="833" y="510" fill="#e2e8f0">MQTT</text>
    <rect x="874" y="488" width="84" height="34" rx="17" fill="#0f172a" stroke="#475569"/>
    <text x="916" y="510" fill="#e2e8f0">webhooks</text>
    <rect x="966" y="488" width="80" height="34" rx="17" fill="#0f172a" stroke="#818cf8"/>
    <text x="1006" y="510" fill="#c7d2fe">Arkimede</text>
    <rect x="1054" y="488" width="86" height="34" rx="17" fill="#0f172a" stroke="#818cf8"/>
    <text x="1097" y="510" fill="#c7d2fe">Recordare</text>
  </g>
</svg>
