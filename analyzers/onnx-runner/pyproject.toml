[project]
name = "onnx-runner"
version = "0.1.0"
description = "A single runner for camera-recognition's ONNX models (analyzer contract v1)"
requires-python = ">=3.11,<3.14"
dependencies = [
  "onnxruntime>=1.20",
  "numpy>=2.0",
  "pillow>=11.0",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "python-multipart>=0.0.20",
  "tokenizers>=0.23.3",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28"]

[tool.uv]
package = false
