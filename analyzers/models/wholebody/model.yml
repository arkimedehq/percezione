# RTMW-m (OpenMMLab, Apache 2.0): RTMPose WholeBody, 133 COCO-WholeBody keypoints (body, feet, face, hands), 256x192.
# Top-down on Frigate's box. Weights: ./fetch.sh (not versioned).
