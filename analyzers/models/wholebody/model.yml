derive:
  posture:
    min_score: 0.3
    lying_torso_deg: 55
    upright_torso_deg: 30  # torso between this and lying_torso_deg: reclined against a backrest, seated
    sitting_thigh_deg: 50
    lying_aspect: 1.4
    lying_min_aspect: 0.9  # horizontal torso in a taller box: bent or leaning, not lying
  # where the hands are relative to the head, in shoulder widths (analyzers/onnx-runner/posture.py: gestures)
  gestures:
    min_score: 0.3
    ear: 0.6        # a hand closer than this to an ear: on the phone
    face: 0.7       # a hand closer than this to the nose: hand at the face (eating, drinking, touching the face)
outputs: [standing, sitting, lying, uncertain]
